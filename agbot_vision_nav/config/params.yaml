# Defaults for vision_nav_node. model_path has no entry here -- it must be
# set explicitly via the model_path launch arg, since the .pt file lives
# outside any catkin package; picking a fragile relative path here would
# fail silently/wrongly if it moved.

# Real-robot defaults shown below. For Gazebo, override camera_topic and set
# camera_topic_is_compressed: false via launch args, since Gazebo's camera
# plugin typically publishes raw sensor_msgs/Image rather than CompressedImage.
camera_topic: /usb_cam/image_raw/compressed
camera_topic_is_compressed: true
cmd_vel_topic: /cmd_vel
debug_image_topic: "~debug/image"
publish_debug_image: true

# Scanline-midpoint centerline estimation (see centerline_estimator.py).
scan_row_fractions: [0.65, 0.78, 0.92]
scan_row_weights: [0.2, 0.3, 0.5]
min_traversable_fraction: 0.10

# MPC controller (see controller.py / MPCRowController).
#
# Dynamics model:  x[k+1] = A x[k] + B u[k]
#   A = [[1, alpha], [0, 1]]   B = [[0], [beta]]
#   State:   x = [offset_norm, slope_term]   (normalized image-space)
#   Control: u = angular_z  (rad/s)
#
# Tuning priority (once in simulation):
#   1. Confirm sign convention (manual off-center test, watch /cmd_vel)
#   2. Tune alpha/beta (model accuracy: lateral coupling + control effectiveness)
#   3. Tune q_offset (how aggressively the robot re-centers laterally)
#   4. Tune r_delta  (smoothness; increase if steering is jerky/oscillatory)
#   5. Tune q_heading (anticipatory heading correction strength)
#   6. Tune r_control (penalizes large angular_z commands)

mpc_horizon: 8           # prediction steps (N)
mpc_dt: 0.1              # seconds per step; set to match your inference rate
mpc_alpha: 0.10          # lateral coupling: offset_norm += alpha * slope_term per step;
                         # scales with forward speed (this value is for 0.15 m/s --
                         # scale proportionally when raising linear_x_cruise)
mpc_beta: 0.10           # control effectiveness: slope_term += beta * angular_z per step
mpc_q_offset: 10.0       # lateral error cost weight (primary tuning knob)
mpc_q_heading: 1.0       # heading error cost weight (anticipatory correction)
mpc_r_control: 0.1       # control effort cost weight
mpc_r_delta: 0.5         # control rate cost weight (smoothness / jerk suppression)

# Speed envelope: sim-validated defaults (Gazebo demo). Raise on the real
# robot via launch args, scaling angular_z_max, delta_angular_z_max, and
# mpc_alpha proportionally with linear_x_cruise to preserve path curvature.
linear_x_cruise: 0.15        # forward speed (m/s)
angular_z_max: 0.3           # hard clamp on |angular_z| (rad/s)
delta_angular_z_max: 0.2     # max angular_z change per step (rad/s); rate limiter
invalid_frame_stop_count: 5  # consecutive invalid frames before publishing zero Twist
max_data_age_sec: 0.5        # watchdog: zero Twist if no inference in this window

# Multi-row mission (headland turns; see mission_fsm.py / row_exit_detector.py).
# mission_enabled: false keeps plain row-following, identical to before --
# safe default while MPC params are still being tuned.
mission_enabled: false
odom_topic: /odometry/filtered   # Jackal EKF odom (wheel + IMU)
num_rows: 3                # corridors to drive; 0 = keep going until no rows left
first_turn_direction: left # headland turn direction for the FIRST transition;
                           # alternates automatically afterwards (boustrophedon)
row_spacing: 0.75          # m between row centerlines (agbot_corn_rows.world)
headland_clearance: 1.0    # m to drive past the last plants before turning
turn_rate: 0.4             # rad/s during in-place 90-degree turns
yaw_tolerance_deg: 5.0     # stop turning within this much of 90 degrees
reacquire_speed: 0.08      # m/s creep while searching for the next corridor
reacquire_max_width: 0.6   # corridor must look narrower than this (normalized)
reacquire_frames: 3        # consecutive corridor frames to re-enter FOLLOW_ROW
reacquire_max_distance: 1.5  # m of creep without a corridor => no rows left => DONE
exit_width_threshold: 0.8  # normalized corridor width that reads as "open field"
exit_detect_frames: 5      # consecutive frames of exit signature required
min_in_row_distance: 2.0   # m of in-row travel before OPEN exit detection arms
blocked_min_traversable_fraction: 0.15  # ground still visible when blocked ahead
blocked_arming_distance: 0.3  # m of in-row travel before BLOCKED detection arms
                              # (much earlier than open, so obstacles right
                              # after row entry still trigger the back-out)

# Blocked-row back-out (rear camera; see mission_fsm.py BACKOUT states).
# On a blocked-ahead signal the robot reverses out of the row steering from
# the rear camera, then lane-changes into the next row. Rear inference only
# runs during BACKOUT, so normal operation cost is unchanged. With
# rear_camera_enabled: false the back-out still works, reversing straight
# on odometry alone.
rear_camera_enabled: false
rear_camera_topic: /camera_rear/image_raw   # sim (Gazebo rear camera);
                                            # real robot later: e.g.
                                            # /usb_cam_rear/image_raw/compressed
rear_camera_topic_is_compressed: false      # true for a real usb_cam
backout_speed: 0.10        # m/s reverse speed while backing out
