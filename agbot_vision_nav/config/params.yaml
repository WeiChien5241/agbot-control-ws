# Defaults for vision_nav_node. model_path has no entry here -- it must be
# set explicitly via the model_path launch arg, since the .pt file lives
# outside any catkin package; picking a fragile relative path here would
# fail silently/wrongly if it moved.

# Real-robot defaults shown below. For Gazebo, override camera_topic and set
# camera_topic_is_compressed: false via launch args, since Gazebo's camera
# plugin typically publishes raw sensor_msgs/Image rather than CompressedImage.
model_device: auto      # auto = CUDA when available, else CPU; or force
                        # cpu/cuda. The node logs the actual device at
                        # startup -- verify it says 'cuda' on the GPU robot.
camera_topic: /usb_cam/image_raw/compressed
camera_topic_is_compressed: true
cmd_vel_topic: /cmd_vel
debug_image_topic: "~debug/image"
publish_debug_image: true

# Scanline-midpoint centerline estimation (see centerline_estimator.py).
# These rows drive STEERING. They were chosen empirically on the TALL camera
# mount; a lower mount images the same ground distances at different heights,
# so re-derive them per mount (tape at 1/2/3 m ahead, one frame, read off the
# pixel rows) rather than nudging blind.
scan_row_fractions: [0.65, 0.78, 0.92]
scan_row_weights: [0.2, 0.3, 0.5]
min_traversable_fraction: 0.10

# Optional dedicated scan rows for the EXIT DETECTOR. Empty = share the
# steering rows above (previous behavior). Steering wants lookahead spread;
# exit detection wants maximum in-row vs open-field separation, and on the low
# camera the bottom-most row images ground so close to the bumper that it is
# wide in BOTH cases (~0.7 in-row) -- moving the exit rows UP separates them
# again without touching field-proven steering.
exit_scan_row_fractions: []
exit_scan_row_weights: []      # empty = uniform

# MPC controller (see controller.py / MPCRowController).
#
# Dynamics model:  x[k+1] = A x[k] + B u[k]
#   A = [[1, alpha], [0, 1]]   B = [[0], [beta]]
#   State:   x = [offset_norm, slope_term]   (normalized image-space)
#   Control: u = angular_z  (rad/s)
#
# Tuning priority (once in simulation):
#   1. Confirm sign convention (manual off-center test, watch /cmd_vel)
#   2. Tune alpha/beta (model accuracy: lateral coupling + control effectiveness)
#   3. Tune q_offset (how aggressively the robot re-centers laterally)
#   4. Tune r_delta  (smoothness; increase if steering is jerky/oscillatory)
#   5. Tune q_heading (anticipatory heading correction strength)
#   6. Tune r_control (penalizes large angular_z commands)

mpc_horizon: 8           # prediction steps (N)
mpc_dt: 0.1              # seconds per step; set to the REAL control period
                         # (1/inference rate; 0.5 on a CPU-only robot at ~2 Hz).
                         # Internally scales mpc_alpha, mpc_beta, and
                         # delta_angular_z_max by dt/0.1: those three are
                         # specified at the 0.1 s reference period below.
mpc_alpha: 0.10          # lateral coupling: offset_norm += alpha * slope_term per
                         # 0.1 s reference step; scales with forward speed (this
                         # value is for 0.15 m/s -- scale proportionally when
                         # raising linear_x_cruise)
mpc_beta: 0.10           # control effectiveness: slope_term += beta * angular_z
                         # per 0.1 s reference step
mpc_q_offset: 10.0       # lateral error cost weight (primary tuning knob)
mpc_q_heading: 1.0       # heading error cost weight (anticipatory correction)
mpc_r_control: 0.1       # control effort cost weight
mpc_r_delta: 0.5         # control rate cost weight (smoothness / jerk suppression)

# Speed envelope: sim-validated defaults (Gazebo demo). Raise on the real
# robot via launch args, scaling angular_z_max, delta_angular_z_max, and
# mpc_alpha proportionally with linear_x_cruise to preserve path curvature.
# If steering is still too aggressive, try (in order, Gazebo first):
# angular_z_max 0.15, delta_angular_z_max 0.1, mpc_r_delta 1.5 /
# mpc_r_control 0.3, mpc_q_offset 5.0; on the CPU robot also mpc_dt 0.5.
linear_x_cruise: 0.15        # forward speed (m/s)
angular_z_max: 0.175         # hard clamp on |angular_z| (rad/s); was 0.3,
                             # which wobbled/hit corn in field testing
delta_angular_z_max: 0.2     # max angular_z change per 0.1 s reference step
                             # (rad/s); rate limiter, scaled by mpc_dt/0.1
invalid_frame_stop_count: 5  # consecutive invalid frames before publishing zero Twist
max_data_age_sec: 0.5        # watchdog: zero Twist if no inference in this window

# Multi-row mission (headland turns; see mission_fsm.py / row_exit_detector.py).
# mission_enabled: false keeps plain row-following, identical to before --
# safe default while MPC params are still being tuned.
mission_enabled: false
odom_topic: /odometry/filtered   # Jackal EKF odom (wheel + IMU)
num_rows: 3                # corridors to drive; 0 = keep going until no rows left
first_turn_direction: left # headland turn direction for the FIRST transition;
                           # alternates automatically afterwards (boustrophedon)
row_spacing: 0.75          # m between row centerlines (agbot_corn_rows.world)
traverse_distance: 0.65    # m of sideways travel after TURN_1. Deliberately
                           # SHORTER than row_spacing: at 0.75 the nose got
                           # too close to the next row's corn just before
                           # TURN_2 (field near-miss, 2026-07); REACQUIRE +
                           # the MPC close the remaining lateral offset.
exit_clear_speed: 0.10     # m/s during EXIT_CLEAR (slower than cruise: the
                           # post-exit leg is where overshoot hurts most)
headland_clearance: 1.5    # m of EXIT_CLEAR forward travel before turning,
                           # measured from where the exit was FIRST SEEN (the
                           # start of the confirmation streak), not from where
                           # it confirmed -- otherwise exit_confirm_distance
                           # would be added on top and the robot would overrun
                           # by 1.15 m. 0.5 clipped the last plants in field
                           # testing (real corn, 2026-07-15); raise toward 1.0
                           # if the turn still hits corn.
exit_clear_min_distance: 0.2  # m always driven after the exit confirms, even
                           # when back-dating has already consumed all of
                           # headland_clearance.

# EXIT_CLEAR revocation: for its first exit_revoke_distance meters the FSM
# keeps checking the exit and falls back to FOLLOW_ROW if it was wrong, so a
# false positive costs a steering wobble instead of a drive into the corn (the
# 2026-07-24 field failure was unrecoverable because the transition was a
# one-way commit). The test looks at the NEAREST scan row only -- the ground
# right beside the robot. It deliberately ignores the far rows: during a
# genuine exit those legitimately see the corn block across the headland, so
# keying revocation on "corn visible beside the corridor anywhere" would revoke
# every real exit.
exit_revoke_enabled: true
exit_revoke_distance: 0.5      # m after confirming during which revert is possible
exit_revoke_fail_distance: 0.25  # m of continuous corn beside the near row => revert
turn_rate: 0.4             # rad/s during in-place 90-degree turns
yaw_tolerance_deg: 5.0     # stop turning within this much of 90 degrees
reacquire_speed: 0.08      # m/s creep while searching for the next corridor
reacquire_confirm_distance: 0.12  # m of sustained in-row view before re-entering
                           # FOLLOW_ROW (= the old 3 frames at 2 Hz and
                           # 0.08 m/s). A row is recognized by CORN ON BOTH
                           # SIDES of the near scan row, not by corridor width:
                           # the old "width < 0.6" rule is a camera-height
                           # constant (normal in-row width is ~0.5 tall but
                           # ~0.7 low), so on the low camera it could never be
                           # satisfied inside a row -- the FSM then crept the
                           # full reacquire_max_distance blind and nearly drove
                           # into the corn (sim, 2026-07-28).
reacquire_steering_enabled: true  # steer while creeping instead of driving dead
                           # straight. Holding a fixed heading for up to
                           # reacquire_max_distance preserves whatever lateral
                           # error the turn left behind; steering closes it.
reacquire_max_distance: 2.0  # m of creep without a corridor => no rows left =>
                             # DONE. 2.0 (was 1.5) leaves margin for back-out
                             # overshoot: the robot may re-approach the rows
                             # from farther out than a normal headland turn.
exit_width_threshold: 0.8  # normalized corridor width that reads as "open field"
exit_flank_edge_margin: 0.05  # width of the outer strip checked at EACH side of
                           # a scan row. OPEN additionally requires both strips
                           # to be mostly traversable (no corn flanking the
                           # corridor). A mid-row side-gap widens the corridor
                           # to ~0.83 but leaves corn in the strips, so it must
                           # NOT read as an exit; a true row end runs
                           # edge-to-edge. NOTE this is effectively a width bar
                           # of ~1 - 2*margin = 0.90, plus the requirement that
                           # BOTH sides are clear (a corridor pinned to the left
                           # edge with corn still on the right is rejected, and
                           # that one-sided case is exactly what a gap in a
                           # single row of corn looks like). >= 1.0 disables the
                           # flank check entirely (width-only behavior).
exit_flank_min_clear_fraction: 0.8  # fraction of each outer strip that must be
                           # traversable. Below 1.0 on purpose: the corridor
                           # scan stops at the FIRST non-traversable pixel, so
                           # one stray misclassified pixel near a border would
                           # otherwise veto the exit outright -- a real risk on
                           # the low-camera masks (~100 annotations vs ~300
                           # tall). Raise toward 1.0 to be stricter.
exit_open_rows_required: 1 # how many scan rows (ANY of them) must be wide
                           # for the open exit. 1 = fire off whichever row
                           # sees open field first -- robust to garbage
                           # segmentation of distant ground beyond the field.
                           # Raise to 2 only if a sparse row ever false-fires.
# Debounce is measured in PHYSICAL UNITS, never in frames: "5 frames" is 2.5 s
# on the 2 Hz CPU robot but 0.2 s on the ~25 Hz GPU robot, which is how a
# mid-row gap fired EXIT_CLEAR instantly in the field (2026-07-24). Defaults
# below reproduce the field-proven CPU-robot timings at ANY inference rate.
exit_confirm_distance: 0.4  # m of sustained OPEN evidence before firing
                           # (= the old 5 frames at 2 Hz and 0.15 m/s). The
                           # accumulator is LEAKY: non-open frames subtract
                           # rather than reset, because at 25 Hz this is ~65
                           # consecutive frames and one flickery frame resetting
                           # the streak would mean it never fires.
exit_detect_min_frames: 2  # floor: no single large-odometry-delta frame may
                           # fire the exit on its own
exit_leak_ratio: 0.5       # how fast the OPEN meter drains vs fills. 1.0
                           # (symmetric) sounds neutral but is not: a signature
                           # true HALF the frames then nets exactly zero and can
                           # NEVER fire, however far the robot drives. That is
                           # what a real-but-marginal exit looks like -- sim
                           # 2026-07-28, where the ground IS traversable but
                           # segments imperfectly (width ~0.8-0.9, patchy
                           # edges): the meter reached 0.13 of 0.40 m, drained
                           # to zero, and the robot drove off the world. At 0.5
                           # anything true more than ~1/3 of the time still
                           # climbs, while a brief mid-row gap still drains
                           # away. Set 1.0 to restore the old behavior.
blocked_leak_ratio: 1.0    # BLOCKED stays symmetric: its leak was tuned in sim
                           # and a back-out is a far bigger commitment.
blocked_confirm_seconds: 4.0  # s of sustained BLOCKED evidence before backing
                           # out (= the old 8 frames at 2 Hz). SECONDS, not
                           # meters: a blocked view stops the robot (the MPC
                           # goes invalid), so a distance counter would never
                           # fill and the back-out would deadlock.
min_in_row_distance: 2.0   # m of in-row travel before OPEN exit detection arms
blocked_min_obstacle_fraction: 0.2  # BLOCKED also needs this much OBSTACLE in
                                    # the lower half -- a sanity check that
                                    # something is really there, vs a garbage
                                    # mask or a dead camera. Measured on the
                                    # OBSTACLE class, NEVER on traversable: a
                                    # blocker fills the view as the robot closes
                                    # in, so the traversable reading falls to
                                    # 0.00 exactly when the obstacle is nearest.
                                    # The old blocked_min_traversable_fraction
                                    # was walked 0.15 -> 0.08 -> 0.02 chasing
                                    # that and still deadlocked the back-out in
                                    # sim (2026-07-30). Blocked already requires
                                    # zero corridor at EVERY scan row, so this
                                    # bar stays low; the 4 s debounce is the real
                                    # occlusion guard. 0.0 disables the gate.
blocked_arming_distance: 0.3  # m of in-row travel before BLOCKED detection arms
                              # (much earlier than open, so obstacles right
                              # after row entry still trigger the back-out)

# Blocked-row back-out (rear camera; see mission_fsm.py BACKOUT states).
# On a blocked-ahead signal the robot reverses out of the row steering from
# the rear camera, then lane-changes into the next row. Rear inference only
# runs during BACKOUT, so normal operation cost is unchanged. With
# rear_camera_enabled: false the back-out is DISABLED: a blocked signal
# stops the robot and ends the mission with the blocked row reported.
rear_camera_enabled: false
rear_camera_topic: /camera_rear/image_raw   # sim (Gazebo rear camera);
                                            # real robot later: e.g.
                                            # /usb_cam_rear/image_raw/compressed
rear_camera_topic_is_compressed: false      # true for a real usb_cam
backout_speed: 0.10        # m/s reverse speed while backing out
