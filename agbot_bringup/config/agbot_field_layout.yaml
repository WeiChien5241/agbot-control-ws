# A hand-described field for Gazebo, built by scripts/build_field_world.py.
#
#   rosrun agbot_bringup build_field_world.py $(rospack find agbot_bringup)/config/agbot_field_layout.yaml
#   rosrun agbot_bringup switch_maize_world.sh field
#
# Instead of placing plants one by one, describe BLOCKS OF ROWS; the script
# places every plant, writes the world snapshot, the ground truth
# (gt_map.csv, which agbot_nav turns into the AMCL map) and a top-down
# preview PNG (field_preview.png) to check the layout without Gazebo.
#
# Coordinates: metres, Gazebo world frame. +x = EAST, +y = NORTH, yaw in
# degrees counter-clockwise from east (0 = east, 90 = north).
#
# Layout (2026-10-14, from the Gazebo screenshots): the robot starts just west
# of a short corridor between two 3-row blocks, FACING NORTH with the corn on
# its right; it turns RIGHT (east), drives through the corridor with corn on
# both sides, turns LEFT (north) across the 3 m gap, drives
# ~1.3 m, turns RIGHT to face the main rows and enters the corridor at the
# entrance. Main rows: two east-west blocks with a cross alley between them.
# Edit freely and rebuild.

snapshot: field              # name for switch_maize_world.sh

# The ground: a flat square of `size` m centred on `center`. Keep a couple of
# metres around the plants and the robot; the builder refuses a layout that
# leaves the ground. (It was a 48 m square, mostly empty, until 2026-10-14.)
ground:
  size: 20.0
  center: [0.5, -0.5]

# Plant model: "tall" (~1.26 m, what the LiDAR can see) or "stock" (~0.63 m,
# what vision nav was validated on).
plant_model: tall

# Applies to every block unless the block overrides it.
defaults:
  row_spacing: 0.76          # m between neighbouring rows (30 in)
  plant_spacing: 0.25        # m between plants along a row. Real corn is
                             # ~0.15-0.20; 0.25 keeps the plant count, and so
                             # the laptop's real-time factor, manageable
  jitter: 0.02               # m of random placement noise per plant

blocks:
  # Each block: rows start at `start` and run `length` m along `heading`;
  # further rows are added `row_spacing` apart to the LEFT (`side: left`) or
  # RIGHT (`side: right`) of the heading.

  - name: north_block        # 4 east-west rows, the robot enters these
    start: [0.0, 1.90]       # west end of the northernmost row
    heading: 0               # rows run east
    length: 8.0
    rows: 4
    side: right              # 2nd..4th rows to the south

  - name: south_block        # 3 east-west rows past the cross alley
    start: [0.0, -2.28]
    heading: 0
    length: 8.0
    rows: 3
    side: right

  # The two short 3-row blocks the robot starts beside: the corridor between
  # their inner rows is 1.9 m wide (centre line y = -1.33) and ends 3 m west
  # of the main rows -- room for the left turn, the short leg north and the
  # right turn onto the entrance. Each block grows AWAY from that corridor.
  - name: west_arm_north
    start: [-7.0, -0.38]     # inner (southern) row; more rows to the north
    heading: 0
    length: 4.0
    rows: 3
    side: left

  - name: west_arm_south
    start: [-7.0, -2.28]     # inner (northern) row; more rows to the south
    heading: 0
    length: 4.0
    rows: 3
    side: right

# The row entrance (the yellow cell): a point on the corridor's centre line,
# just west of the first plants, facing along the rows. Corridor between the
# north block's 3rd and 4th rows (y = 0.38 and -0.38).
entrance: [-0.5, 0.0, 0]     # x, y, yaw_deg

# Where the robot starts -- and, with `trailer:` below, where it STOPS after
# backing off the trailer: just west of the
# short corridor, FACING NORTH with the corn to its right. Its first move is a
# right turn into the corridor. Pose read from the user's Gazebo model
# state, 2026-10-14 (yaw 1.5917 rad).
spawn: [-7.92, -1.30, 91.2]  # x, y, yaw_deg

# Walls: static grey boxes the LiDAR sees cleanly (a SLAM map of corn alone
# is noisy, and open ground past the last plant maps as nothing at all, which
# move_base plans across as drivable unknown). Each segment runs `from` -> `to`
# in metres; the builder also writes them into the ground-truth map. Delete
# the block to get the corn-only field back. (Added 2026-10-14.)
#   fence:  closes the whole field, ~1.1 m north of the north block, 1.2 m
#           south of the south blocks, 2 m east of the row ends.
#   pen:    the start area. Its south stub continues the start corridor's
#           southern inner row west to the fence, so from the spawn the ONLY
#           way out is RIGHT (east) through the corridor.
#   bay:    (2026-11-16) the trailer's parking bay, north of the spawn,
#           replacing the old pen_north stub: the trailer comes in from the
#           south and parks heading north, so the bay is closed west, east and
#           north. fence_west moved 0.4 m west (to -9.2) to make it 2.05 m
#           wide for a 1.3 m trailer. bay_east stops 0.15 m short of the west
#           arm's first plants (x = -7.0), like the stubs, so it doesn't shove
#           them.
walls:
  height: 1.5                # m; the scan slice is 0.10-1.20 m above base_link
  thickness: 0.10
  segments:
    - {name: fence_west,  from: [-9.2, -5.0], to: [-9.2,  5.0]}
    - {name: bay_north,   from: [-9.2,  5.0], to: [-7.15, 5.0]}
    - {name: bay_east,    from: [-7.15, 5.0], to: [-7.15, -0.38]}
    - {name: fence_north, from: [-7.15, 3.0], to: [10.0,  3.0]}
    - {name: fence_east,  from: [10.0,  3.0], to: [10.0, -5.0]}
    - {name: fence_south, from: [10.0, -5.0], to: [-9.2, -5.0]}
    - {name: pen_south,   from: [-9.2, -2.28], to: [-7.1, -2.28]}

# The trailer the robot is unloaded from (2026-11-16). Placed by the builder
# so that backing STRAIGHT off it ends exactly at `spawn`: it is parked
# heading the spawn's way (north), the robot sits on the deck facing north,
# reverses south down the ramp and stops at the spawn, corn on its right.
# In the world but NOT in the map (the real trailer moves). The builder prints
# the on-deck spawn pose for agbot_gazebo.launch and the wheel travel back to
# `spawn`.
# ⚠ PLACEHOLDER DIMENSIONS -- nobody has measured the real trailer yet.
# "About knee height" (the user) -> 0.50 m deck; ramp length guessed.
trailer:
  deck_height: 0.50          # m
  ramp_length: 1.80          # m along the slope -> 16.1 deg
  deck_length: 3.0           # m
  deck_width: 1.3            # m
  ramp_width: 1.0            # m
  ramp_foot_gap: 0.5         # m from the robot's front bumper (at spawn) to the ramp foot
  robot_setback: 0.55        # m from the deck's rear edge to base_link when parked
