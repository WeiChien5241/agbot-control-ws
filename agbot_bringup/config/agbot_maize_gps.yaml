# Maize world with a HEADLAND BIG ENOUGH TO DRIVE ACROSS, for testing the GPS
# transit and the handoff to vision nav.
#
# Identical to agbot_maize_small.yaml in every way that affects perception --
# same models, same row geometry, same coarse heightmap, same seed -- so
# segmentation sees exactly what it sees in the small world and a comparison
# between the two is legitimate. The ONE change is ground_headland.
#
# ⚠ WHY THIS WORLD EXISTS. The existing worlds have nowhere to put a trailer.
# The generator spawns the robot only ~0.94 m before the first plants, and
# ground_headland (default 2.0 m) is what pads the heightmap beyond the plant
# bounding box -- so in the small world the ground simply ENDS about 2.5 m
# before the rows. A GPS waypoint placed 2-3 m out sits behind the spawn point,
# and anything further out is off the heightmap entirely, where the robot falls
# through the world. There is no transit to test.
#
# With the headland below there is real open ground on both ends: room to park
# the robot well back, drive to a row entrance under GPS, arrive on the row
# axis, and hand over to vision nav.
#
# Master copy lives here (agbot_bringup is tracked in git);
# scripts/generate_maize_world.sh copies it into virtual_maize_field/config/
# (third-party, untracked) before generating, because generate_world.py only
# reads configs from its own package.
#
# Generate with:
#   rosrun agbot_bringup generate_maize_world.sh agbot_maize_gps gps
#   rosrun agbot_bringup switch_maize_world.sh gps
row_length: 6              # m -- same as small
rows_count: 4              # 4 rows -> 3 corridors (mission num_rows:=3)
row_segments:
  - straight               # real corn fields are straight
ground_resolution: 0.15    # coarse heightmap (the _fast preset value)
ground_elevation_max: 0.01 # nearly flat ground
hole_prob: 0.0             # no gaps: deterministic corridors, so a mid-row
                           # EXIT_CLEAR here is a detector defect outright
hole_size_max: 0
seed: 42                   # reproducible layout AND reproducible spawn pose

# ⚠ THE ONE CHANGE FROM agbot_maize_small.yaml, and the reason for this file.
# Default is 2.0 m; this pads the heightmap beyond the plants at BOTH ends.
#
# ⚠ 8.0 was tried first and was NOT ENOUGH, for a reason worth writing down: the
# transit is not the only thing that needs room. The heading bootstrap drives
# STRAIGHT for several metres before any steering (map-frame yaw is wrong at
# boot and only motion fixes it), and with only ~7 m between the trailer and the
# rows that straight leg nearly reached the goal before the estimate converged.
# The robot then had to turn back to its staging point, and the approach fell
# apart from there. Budget: bootstrap (up to ~10 m) + a staging leg + a 3 m
# on-axis approach, so ~20 m of open ground before the first plants.
#
# It costs only heightmap area, not plant count, so the RTF hit is small --
# plants are the physics driver (HANDOFF3 0f) and this world still has 173.
ground_headland: 20.0
