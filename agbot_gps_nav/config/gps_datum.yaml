# =============================================================================
# THE DATUM -- the single definition of where the map frame's origin sits on
# Earth. Every metric coordinate in this package is measured from here.
#
# TWO consumers read THIS FILE, so there is exactly one number to change:
#
#   1. navsat_transform_node, as its `datum` param (see gps_localization.launch).
#      This is what makes the map frame REPEATABLE ACROSS SESSIONS. Without an
#      explicit datum, navsat_transform takes its origin from the first fix it
#      happens to receive, so every boot gets a different origin and every saved
#      waypoint silently means somewhere else.
#
#   2. In simulation, GAZEBO_WORLD_LAT / GAZEBO_WORLD_LON, exported by
#      agbot_bringup/scripts/load_robot_description.sh before it runs xacro.
#      jackal.gazebo:32-33 reads them with $(optenv ...) to place the simulated
#      GPS receiver on Earth. Setting the two equal means the map frame origin
#      coincides with the Gazebo world origin, so `map` coordinates and Gazebo
#      coordinates are THE SAME NUMBERS -- worth a lot when debugging.
#      The hector default if this is not set is 49.9 / 8.9: Darmstadt, Germany.
#
# Format is [latitude_deg, longitude_deg, yaw_rad] -- robot_localization's own
# datum convention. The yaw is the robot's heading in ENU at the datum; 0.0
# means "facing east", which is what the sim spawns at (see the heading note in
# gps_localization.launch).
# =============================================================================

# TODO(datum): PLACEHOLDER -- approximate centre of Purdue ACRE, taken from a
# map, NOT surveyed. It is close enough for simulation and for satellite tiles
# to show the right area, and it is NOT close enough to save a real waypoint
# against. Replace with a surveyed fix from the Reach M2 BEFORE recording any
# field waypoint, and re-record anything captured before the change: every
# stored waypoint is relative to this origin, so moving it moves them all.
datum: [40.4693, -86.9915, 0.0]
