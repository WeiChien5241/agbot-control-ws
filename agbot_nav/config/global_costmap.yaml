global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 2.0
  publish_frequency: 1.0
  rolling_window: false
  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflater_layer,  type: "costmap_2d::InflationLayer"}
  static_layer:
    map_topic: /map
    # ⚠ UNKNOWN IS FREE. The LiDAR slice gets no return from open ground, so
    # slam_toolbox leaves most of the headland UNKNOWN, not free. Tracking
    # unknown space would leave the planner nowhere to drive.
    track_unknown_space: false
    lethal_cost_threshold: 65
