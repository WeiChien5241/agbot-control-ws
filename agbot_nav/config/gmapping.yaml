# gmapping (Rao-Blackwellized particle-filter SLAM), the classic ROS1 mapper.
# Started from jackal_navigation's gmapping.launch; lines with a comment
# differ. Alternative to slam_toolbox in mapping.launch (slam:=gmapping).
# Needs: sudo apt install ros-noetic-gmapping
base_frame: base_link
odom_frame: odom
map_frame: map

map_update_interval: 2.0   # 5.0; faster feedback while driving
# Our /scan fills no-return beams with 39 m (scan.yaml). maxRange 40 keeps
# them as "nothing hit"; maxUrange 25 < 39 then raytraces them as FREE out to
# 25 m, so open ground becomes free space instead of unknown.
maxUrange: 25.0            # 5.0 in the Jackal demo (a 2D indoor laser)
maxRange: 40.0             # 10.0
sigma: 0.05
kernelSize: 1
lstep: 0.05
astep: 0.05
iterations: 5
lsigma: 0.075
ogain: 3.0
minimumScore: 50.0         # 0; reject weak scan matches -- in open ground a
                           # sparse scan "matches" almost anywhere
lskip: 4                   # 0; use every 5th of the 1800 beams (360)

srr: 0.05                  # odometry noise; 0.01-0.02 in the demo. Raised:
srt: 0.05                  # the sim Jackal slips with its wheels still
str: 0.05
stt: 0.05

linearUpdate: 0.2          # 0.1
angularUpdate: 0.1         # 0.05
temporalUpdate: -1.0
resampleThreshold: 0.5
particles: 40              # 10 in the demo; more particles = more robust to
                           # a bad match, more CPU

xmin: -15.0                # initial map size; it grows as needed
ymin: -15.0
xmax: 15.0
ymax: 15.0
delta: 0.05                # 5 cm cells, same as slam_toolbox

llsamplerange: 0.01
llsamplestep: 0.01
lasamplerange: 0.005
lasamplestep: 0.005
