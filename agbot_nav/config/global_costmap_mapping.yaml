# Global costmap WHILE MAPPING (mapping.launch move_base:=true).
# No static layer: the live slam_toolbox map only spans the bounding box of
# real returns, and a static layer resizes the costmap to it -- in open ground
# the robot is then off the costmap and every plan fails ("The robot's start
# position is off the global costmap"). A large rolling window of live
# obstacles is all a mapping lap needs.
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 2.0
  publish_frequency: 1.0
  rolling_window: true
  width: 60.0
  height: 60.0
  resolution: 0.1
  plugins:
    - {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflater_layer,  type: "costmap_2d::InflationLayer"}
