base_global_planner: global_planner/GlobalPlanner
base_local_planner: dwa_local_planner/DWAPlannerROS

shutdown_costmaps: false
controller_frequency: 10.0
controller_patience: 10.0
planner_frequency: 1.0
planner_patience: 5.0
oscillation_timeout: 20.0
oscillation_distance: 0.3
recovery_behavior_enabled: true
clearing_rotation_allowed: false   # a spin next to the corn or the trailer
                                   # is the wrong recovery here

GlobalPlanner:
  allow_unknown: true      # see global_costmap.yaml: unknown is open ground
  use_dijkstra: true
  use_grid_path: false
  default_tolerance: 0.0
  cost_factor: 0.55
  neutral_cost: 66
  lethal_cost: 253

DWAPlannerROS:
  # Velocities. Forward only: the trailer back-off is a separate blind
  # reverse leg, not a planner manoeuvre.
  max_vel_trans: 0.5
  min_vel_trans: 0.05
  max_vel_x: 0.5
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 1.0
  min_vel_theta: 0.2
  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 2.0
  holonomic_robot: false

  # The handoff wants <= 0.20 m off the corridor axis and <= 12 deg of heading
  # (handoff_fsm). These leave margin on both.
  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.08   # 4.6 deg
  latch_xy_goal_tolerance: true

  sim_time: 1.7
  sim_granularity: 0.025
  vx_samples: 10
  vy_samples: 1
  vth_samples: 20
  controller_frequency: 10.0

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.05
  publish_cost_grid_pc: false
  publish_traj_pc: false
