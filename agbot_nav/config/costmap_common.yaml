# Shared by the global and local costmap.
# Jackal is 0.508 x 0.430 m over the wheels.
footprint: [[-0.26, -0.22], [-0.26, 0.22], [0.26, 0.22], [0.26, -0.22]]
footprint_padding: 0.03
transform_tolerance: 0.5

obstacles_layer:
  observation_sources: scan
  scan:
    topic: /scan_obstacles   # stalks only, not leaves: see scan.launch
    data_type: LaserScan
    sensor_frame: base_link
    marking: true
    clearing: true
    obstacle_range: 4.0
    raytrace_range: 6.0

# Inscribed radius is 0.25 (footprint + padding). 0.45 / 6.0 still charged
# 76 of 252 at 0.45 m from a stalk, which in the 1.9 m start corridor left
# almost no cheap ground once the leaves were marked too (2026-10-19).
inflater_layer:
  inflation_radius: 0.35
  cost_scaling_factor: 8.0
